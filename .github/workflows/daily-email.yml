name: Daily Trading Bot

on:
  schedule:
    # Times are in UTC! India is UTC+5:30
    - cron: '45 3 * * 1-5'   # 9:15 AM IST (Discovery)
    - cron: '5 4 * * 1-5'    # 9:35 AM IST (Monitoring)
    - cron: '15 4 * * 1-5'   # 9:45 AM IST (Monitoring)
    - cron: '30 4 * * 1-5'   # 10:00 AM IST (Monitoring)
    - cron: '45 4 * * 1-5'   # 10:15 AM IST (Monitoring)
    - cron: '0 5 * * 1-5'    # 10:30 AM IST (Monitoring)
    - cron: '15 5 * * 1-5'   # 10:45 AM IST (Monitoring)
    - cron: '30 5 * * 1-5'   # 11:00 AM IST (Monitoring)
    - cron: '45 5 * * 1-5'   # 11:15 AM IST (Monitoring)
    - cron: '0 6 * * 1-5'    # 11:30 AM IST (Monitoring)
    - cron: '30 6 * * 1-5'   # 12:00 PM IST (Monitoring)
    - cron: '0 7 * * 1-5'    # 12:30 PM IST (Monitoring)
    - cron: '30 7 * * 1-5'   # 1:00 PM IST (Monitoring)
    - cron: '0 9 * * 1-5'    # 2:30 PM IST (Monitoring)
    - cron: '30 9 * * 1-5'   # 3:00 PM IST (Monitoring + Daily Summary)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install pandas numpy yfinance xgboost scikit-learn imbalanced-learn openpyxl
      - name: Run Trading Script
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
        run: python PythonApplication1.py
      - name: Commit and Push Excel Log
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git pull
          git add trading_log.xlsx
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Trading Log [skip ci]" && git push)
